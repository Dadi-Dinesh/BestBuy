name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run dist:win
      - run: node scripts/verify-desktop.cjs
        env:
          BESTBUY_TEST_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\BestBuy.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BestBuy-Windows-x64
          path: release/BestBuy-Setup-*-x64.exe
          if-no-files-found: error
